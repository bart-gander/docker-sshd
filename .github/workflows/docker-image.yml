name: docker-image

on:
  push:
    branches: [ master, develop ]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  IMAGE: ghcr.io/${{ github.repository_owner }}/kube-sshd

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_suffix: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            platform_suffix: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        shell: bash
        run: |
          set -euo pipefail
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push per-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ env.IMAGE }}:latest-${{ matrix.platform_suffix }}
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}-${{ matrix.platform_suffix }}
          cache-from: type=gha,scope=kube-sshd-${{ matrix.platform_suffix }}
          cache-to: type=gha,mode=max,scope=kube-sshd-${{ matrix.platform_suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  publish-manifest:
    name: publish manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Compute image tag
        shell: bash
        run: |
          set -euo pipefail
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create and push multi-arch manifests
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE}:${IMAGE_TAG}" \
            "${IMAGE}:${IMAGE_TAG}-amd64" \
            "${IMAGE}:${IMAGE_TAG}-arm64"

          if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            docker buildx imagetools create -t "${IMAGE}:${GITHUB_REF_NAME}" \
              "${IMAGE}:latest-amd64" \
              "${IMAGE}:latest-arm64"

            if [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
              docker buildx imagetools create -t "${IMAGE}:latest" \
                "${IMAGE}:latest-amd64" \
                "${IMAGE}:latest-arm64"
            fi
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            docker buildx imagetools create -t "${IMAGE}:${GITHUB_REF_NAME}" \
              "${IMAGE}:${IMAGE_TAG}-amd64" \
              "${IMAGE}:${IMAGE_TAG}-arm64"
          fi

      - name: Inspect published image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}"
